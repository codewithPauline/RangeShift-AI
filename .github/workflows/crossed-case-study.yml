name: Crossed Plethodon case study

on:
  workflow_dispatch:
  push:
    branches: [feature/permanent-crossed-figure]
    paths:
      - ".github/workflows/crossed-case-study.yml"
      - "examples/case_studies/plethodon_cinereus/make_crossed_figure.py"

permissions:
  contents: write

jobs:
  crossed-plethodon:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[geo]"
      - name: Retrieve public GBIF and WorldClim source data
        run: |
          python examples/real_ecology/prepare_gbif_worldclim.py \
            --species "Plethodon cinereus" --country US --max-records 400 \
            --background 400 --seed 42 --output-dir real_ecology_output
      - name: Prepare six aligned WorldClim CMIP6 futures
        run: |
          python examples/case_studies/plethodon_cinereus/prepare_climate_scenarios.py \
            --training-csv real_ecology_output/gbif_worldclim_training.csv \
            --output-dir plethodon_cinereus_climate \
            --gcms ACCESS-CM2 MIROC6 MRI-ESM2-0 \
            --ssps ssp245 ssp585 --period 2061-2080
      - name: Run full crossed ensemble
        run: |
          python examples/case_studies/plethodon_cinereus/run_crossed_uncertainty.py \
            --training-csv real_ecology_output/gbif_worldclim_training.csv \
            --scenario-json plethodon_cinereus_climate/scenario_layers.json \
            --output-dir plethodon_crossed_output --models 12 --trees 100
      - name: Render crossed-uncertainty figure and numerical summary
        run: |
          python examples/case_studies/plethodon_cinereus/make_crossed_figure.py --raster-dir plethodon_crossed_output/rasters --figure plethodon_crossed_output/crossed_uncertainty.png --summary plethodon_crossed_output/figure_statistics.json
      - name: Commit permanent public-case-study PNG to feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/permanent-crossed-figure'
        run: |
          mkdir -p docs/assets
          cp plethodon_crossed_output/crossed_uncertainty.png docs/assets/plethodon_crossed_uncertainty.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/plethodon_crossed_uncertainty.png
          if ! git diff --cached --quiet; then
            git commit -m "Add verified public-data crossed uncertainty PNG"
            git push
          fi
      - name: Upload uncertainty rasters and provenance
        uses: actions/upload-artifact@v4
        with:
          name: plethodon-crossed-model-climate-uncertainty
          path: |
            plethodon_crossed_output/
            real_ecology_output/provenance.json
            plethodon_cinereus_climate/climate_provenance.json
          if-no-files-found: error
          retention-days: 30
