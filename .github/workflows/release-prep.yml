name: Release prep

on:
  push:
    branches:
      - "release/**"
    paths:
      - "pyproject.toml"
      - "CITATION.cff"
      - "src/rangeshift/__init__.py"
      - ".github/workflows/release-prep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check release candidate version consistency
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert ('__version__ = "' + version + '"') in Path("src/rangeshift/__init__.py").read_text()
          assert ("version: " + version) in Path("CITATION.cff").read_text()
          print("Candidate version metadata consistent:", version)
          PY
