name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  geospatial:
    name: Geospatial extras
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install geospatial and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,geo]"

      - name: Run full test suite with geospatial extras
        run: pytest -q

  explainability:
    name: Explainability extras
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install explainability and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,explain]"

      - name: Run explainability tests
        run: pytest -q tests/test_explainability.py

  product:
    name: Interactive app extras
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install app, geospatial, and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,geo,app]"

      - name: Smoke-test the Streamlit explorer
        run: pytest -q tests/test_app.py

  package:
    name: Build distribution packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Verify wheel installation
        run: |
          python -m venv /tmp/rangeshift-wheel-test
          /tmp/rangeshift-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/rangeshift-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/rangeshift-wheel-test/bin/python -c "import rangeshift; print(rangeshift.__version__)"
