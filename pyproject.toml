[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rangeshift-ai"
version = "0.4.0"
description = "Machine-learning tools for species habitat suitability and range-shift analysis."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Pauline Owusu-Ansah"}
]
keywords = [
  "machine-learning",
  "species-distribution-modeling",
  "ecology",
  "climate-change",
  "biogeography",
  "conservation",
  "geospatial"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: GIS"
]
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3"
]

[project.optional-dependencies]
geo = [
  "geopandas>=1.1",
  "matplotlib>=3.8",
  "pyproj>=3.6,<3.8",
  "rasterio>=1.4"
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[project.scripts]
rangeshift = "rangeshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
